name: "📱 E2E Mobile Tests"

on:
  push:
    branches: [main, develop]
    paths:
      - 'automation-apps/**'
      - 'features/**'
  pull_request:
    branches: [main]
    paths:
      - 'automation-apps/**'
      - 'features/**'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
      tags:
        description: 'Cucumber tags to run (e.g., @smoke, @regression)'
        required: false
        default: ''

jobs:
  e2e-android:
    name: "Appium Android"
    runs-on: ubuntu-latest
    if: ${{ inputs.platform == 'android' || inputs.platform == '' }}
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation-apps/package-lock.json

      - name: ☕ Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            cd automation-apps
            npm ci
            npm run test:android

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: automation-apps/allure-results/
          retention-days: 30

  e2e-ios:
    name: "Appium iOS"
    runs-on: macos-latest
    if: ${{ inputs.platform == 'ios' }}
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation-apps/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: automation-apps
        run: npm ci

      - name: 📱 Boot iOS Simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
            if 'iOS' in runtime:
              for d in devices:
                if 'iPhone' in d['name'] and d['isAvailable']:
                  print(d['udid'])
                  sys.exit(0)
          " | head -1)
          xcrun simctl boot "$DEVICE_ID" || true
          echo "DEVICE_ID=$DEVICE_ID" >> $GITHUB_ENV

      - name: 🧪 Run E2E Tests
        working-directory: automation-apps
        run: npm run test:ios

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: automation-apps/allure-results/
          retention-days: 30

