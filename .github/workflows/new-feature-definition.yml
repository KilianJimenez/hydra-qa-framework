name: "QA: New Feature Definition"

on:
  workflow_dispatch:
    inputs:
      description:
        description: "Functional description with acceptance criteria (or Jira ticket ID)"
        required: true
        type: string
      model:
        description: "GitHub Models model to use"
        required: false
        type: choice
        default: "openai/gpt-4.1"
        options:
          - "openai/gpt-4.1"
          - "openai/gpt-4.1-mini"
          - "openai/gpt-4o"

permissions:
  contents: read
  models: read

jobs:
  refine-and-generate:
    name: Refine & Generate Test Cases
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install CI dependencies
        working-directory: .github/ci
        run: npm ci

      - name: Run New Feature Definition workflow
        working-directory: .github/ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_MODELS_MODEL: ${{ inputs.model }}
          WORKFLOW_INPUT: >-
            {"description": "${{ inputs.description }}"}
          WORKFLOW_OUTPUT: ${{ runner.temp }}/workflow-output.json
        run: node run-workflow.mjs new-feature-definition

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-feature-results
          path: ${{ runner.temp }}/workflow-output.json
          retention-days: 30
