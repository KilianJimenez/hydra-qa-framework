name: "QA: Refinement from Jira"

# Triggered by Jira Automation via an incoming webhook.
# In Jira Automation, configure a "Send web request" action with:
#   URL:    https://api.github.com/repos/<owner>/<repo>/dispatches
#   Method: POST
#   Headers:
#     Authorization: Bearer <JIRA_GITHUB_PAT>   (repo secret — see below)
#     Content-Type:  application/json
#   Body:
#     {
#       "event_type": "jira-qa-trigger",
#       "client_payload": {
#         "issue_key":       "{{issue.key}}",
#         "issue_summary":   "{{issue.summary.escapeJson}}",
#         "issue_type":      "{{issue.type}}",
#         "status":          "{{issue.status.name}}",
#         "description":     "{{issue.description.escapeJson}}",
#         "reporter":        "{{issue.reporter.displayName.escapeJson}}",
#         "assignee":        "{{issue.assignee.displayName.escapeJson}}",
#         "actionToPerform": "{{actionToPerform}}"
#       }
#     }
#
#   IMPORTANT: any smart value that can contain free-text (summary, description,
#   display names, etc.) MUST use the `.escapeJson` modifier. Jira Automation
#   substitutes smart values as raw text — unescaped quotes, backslashes, or
#   newlines in the source field will break the JSON body and GitHub's
#   `dispatches` endpoint will reject it with "Problems parsing JSON" (HTTP 400).
#
#   `actionToPerform` is a Jira Automation Smart Value. Create it beforehand with
#   the rule's "Create variable" action (name: actionToPerform) — or supply it as
#   a manual-trigger input — then reference it as {{actionToPerform}} in the body
#   above. The workflow reads it via
#   `${{ github.event.client_payload.actionToPerform }}`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   JIRA_BASE_URL      — e.g. https://your-org.atlassian.net
#   JIRA_EMAIL         — service-account email used for Jira REST API
#   JIRA_API_TOKEN     — Jira API token for that service account
#   COPILOT_CLI_TOKEN  — fine-grained PAT (v2) with "Copilot Requests" permission,
#                        used to authenticate the GitHub Copilot CLI. Classic
#                        (ghp_) tokens are not supported.
#
# Required repository variables (Settings → Secrets and variables → Actions → Variables):
#   JIRA_QA_TRIGGER_EVENT_TYPE  — must match the event_type sent by Jira (default: jira-qa-trigger)

on:
  repository_dispatch:
    types:
      - jira-qa-trigger  # Must match the event_type value sent by Jira Automation

permissions:
  contents: read

jobs:
  handle-jira-event:
    name: Handle Jira Event — ${{ github.event.client_payload.issue_key }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Print incoming payload (debug)
        run: |
          echo "Issue Key:     ${{ github.event.client_payload.issue_key }}"
          echo "Issue Type:    ${{ github.event.client_payload.issue_type }}"
          echo "Status:        ${{ github.event.client_payload.status }}"
          echo "Reporter:      ${{ github.event.client_payload.reporter }}"
          echo "Action:        ${{ github.event.client_payload.actionToPerform }}"

      - name: Run New Feature Definition workflow
        id: qa-workflow
        env:
          # CI is already set to "true" by the GitHub Actions runner by
          # default, but it is declared explicitly here for clarity: the
          # Conductor agent checks this variable to determine its Execution
          # Context (CI vs Local) and forwards it explicitly to every
          # subagent it delegates to (Refiner, Generator, Manual, Automator).
          CI: "true"
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_CLI_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ github.event.client_payload.issue_key }}
          ACTION_TO_PERFORM: ${{ github.event.client_payload.actionToPerform }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./ci/disable-not-needed-skills.sh

          PROMPT="$(./ci/select-prompt.sh)"

          copilot -s --agent conductor \
            --allow-all-tools --no-ask-user \
            --log-level error --no-color \
            -p "$PROMPT $ISSUE_KEY" \
            | tee "$RUNNER_TEMP/agent-output.txt"

      - name: Comment result on Jira issue
        if: always()
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ github.event.client_payload.issue_key }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BASE_URL="${JIRA_BASE_URL%/}"
          AUTH=$(printf '%s' "$JIRA_EMAIL:$JIRA_API_TOKEN" | base64 -w 0)
          AGENT_OUTPUT_FILE="$RUNNER_TEMP/agent-output.txt"
          [ -f "$AGENT_OUTPUT_FILE" ] || echo "No agent output was captured." > "$AGENT_OUTPUT_FILE"

          BODY=$(jq -n \
            --arg run_url "$RUN_URL" \
            --rawfile agent_output "$AGENT_OUTPUT_FILE" \
            '{body:{version:1,type:"doc",content:[
              {type:"paragraph",content:[{type:"text",text:"Copilot QA agent result:"}]},
              {type:"codeBlock",attrs:{language:"text"},content:[{type:"text",text:$agent_output}]},
              {type:"paragraph",content:[{type:"text",text:"Full results: "},{type:"text",text:"GitHub Actions run",marks:[{type:"link",attrs:{href:$run_url}}]}]}
            ]}}')

          curl --silent --fail --show-error \
            --request POST \
            --url "$BASE_URL/rest/api/3/issue/$ISSUE_KEY/comment" \
            --header "Authorization: Basic $AUTH" \
            --header "Content-Type: application/json" \
            --data "$BODY"