name: "🌐 E2E Web Tests"

on:
  push:
    branches: [main, develop]
    paths:
      - 'automation-web/**'
      - 'features/**'
  pull_request:
    branches: [main]
    paths:
      - 'automation-web/**'
      - 'features/**'
  workflow_dispatch:
    inputs:
      tags:
        description: 'Cucumber tags to run (e.g., @smoke, @regression)'
        required: false
        default: ''
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - local
          - staging
          - production

jobs:
  e2e-web:
    name: "Playwright E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      TEST_ENV: ${{ inputs.environment || 'staging' }}
      BROWSER: ${{ matrix.browser }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: automation-web/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: automation-web
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        working-directory: automation-web
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 🧪 Run E2E Tests
        working-directory: automation-web
        run: |
          if [ -n "${{ inputs.tags }}" ]; then
            npm run test:tag -- "${{ inputs.tags }}"
          else
            npm test
          fi

      - name: 📊 Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.browser }}
          path: |
            automation-web/test-results/
          retention-days: 30

      - name: 📸 Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: automation-web/test-results/screenshots/
          retention-days: 10

      - name: 🔍 Upload Traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-traces-${{ matrix.browser }}
          path: automation-web/test-results/traces/
          retention-days: 10

